name: Android APK — VivahSutra
on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - feature/native-android-v1
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# Retain only the latest APK build per development branch, including PR-triggered runs.
# Prevents wasting free GitHub Actions minutes on superseded commits.
concurrency:
  group: vivahsutra-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Align Expo dependency versions
        run: npx expo install --fix
      - name: Verify six designs and core app integrations
        run: node scripts/smoke-check.cjs
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone APK for device testing
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Upload unsigned-production TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: VivahSutra-Android-Test-APK
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

# The generated release build uses the React Native template's debug signing.
# It is an installable test APK, NOT a Play Store / APPLIQ production-signed build.
